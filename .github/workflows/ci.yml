name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: make validate-protocol PYTHON=python
      - run: make verify-assets PYTHON=python
      - run: make check-language PYTHON=python
      - run: make self-test PYTHON=python
      - run: python scripts/run_all.py --config configs/default.yaml --include-disabled --dry-run

  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject empty Markdown files
        run: |
          while IFS= read -r -d '' file; do
            test -s "$file" || { echo "Empty Markdown file: $file"; exit 1; }
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
