%YAML:1.0

#--------------------------------------------------------------------------------------------
# System config
#--------------------------------------------------------------------------------------------

# When the variables are commented, the system doesn't load a previous session or not store the current one

# If the LoadFile doesn't exist, the system give a message and create a new Atlas from scratch
#System.LoadAtlasFromFile: "Session_CERBERUS_Stereo_Inertial"

# The store file is created from the current session, if a file with the same name exists it is deleted
#System.SaveAtlasToFile: "Session_CERBERUS_Stereo_Inertial"

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "KannalaBrandt8"

# Camera calibration and distortion parameters (OpenCV)
# Left Camera (cam0)
Camera1.fx: 347.071460037321
Camera1.fy: 347.206531326242
Camera1.cx: 353.348326050556
Camera1.cy: 262.473957726965

# Kannala-Brandt distortion parameters for cam0
Camera1.k1: -0.046561613517
Camera1.k2: 0.015491618019
Camera1.k3: -0.018372737817
Camera1.k4: 6.408857e-03

# Right Camera (cam1)
Camera2.fx: 347.546596134171
Camera2.fy: 347.99744359199
Camera2.cx: 363.307025056206
Camera2.cy: 272.565800571654

# Kannala-Brandt distortion parameters for cam1
Camera2.k1: -0.044545351381
Camera2.k2: 0.015373456519
Camera2.k3: -0.019131701962
Camera2.k4: 6.781111e-03

Camera.width: 720
Camera.height: 540

# Overlapping area between images (for stereo matching)
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 719
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 719

# Camera frames per second
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.9999912392, 0.0013490671, -0.0039625080, 0.0995674180,
         -0.0013414748, 0.9999972607, 0.0019180581, -0.0002056165,
         0.0039650847, -0.0019127257, 0.9999903097, 0.0006102443,
         0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]

# Transformation from camera 0 to body-frame (imu)
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [-0.9999953663, 0.0012113160, -0.0027928745, 0.0379875397,
         0.0027885800, -0.0035326542, -0.9999898720, -0.0787753380,
         -0.0012211700, -0.9999930265, 0.0035292600, 0.0277921179,
         0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]

# IMU noise (estimated for CERBERUS dataset)
IMU.NoiseGyro: 1.700000e-04
IMU.NoiseAcc: 2.000000e-03
IMU.GyroWalk: 1.939300e-05
IMU.AccWalk: 3.000000e-03
IMU.Frequency: 200.0

# Fast IMU initialization (skip acceleration check for simple sequences)
# Set to 1 to enable fast initialization, 0 to require acceleration change > 0.5
IMU.fastInit: 1

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1200

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
